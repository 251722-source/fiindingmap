<!DOCTYPE html>
<html lang="ko">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>블루 익스플로러: 장소 검색 서비스</title>
    <style>
        /* 기본 설정 및 미니멀한 서체 적용 */
        body, html {
            margin: 0;
            padding: 0;
            height: 100%;
            font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, 'Helvetica Neue', Arial, sans-serif;
            background-color: #f8fafc;
            color: #334155;
            -webkit-font-smoothing: antialiased;
        }

        /* 2분할 레이아웃 컨테이너 */
        #container {
            display: flex;
            width: 100%;
            height: 100vh;
        }

        /* 왼쪽 사이드바 (청량한 화이트&블루 대시보드 스타일) */
        #sidebar {
            width: 360px;
            height: 100%;
            padding: 24px 20px;
            box-sizing: border-box;
            border-right: 1px solid #e2e8f0;
            display: flex;
            flex-direction: column;
            background-color: #ffffff;
            box-shadow: 4px 0 24px rgba(148, 163, 184, 0.08);
            z-index: 10;
        }

        /* 깔끔한 서비스 메인 타이틀 */
        .service_title {
            font-size: 16px;
            font-weight: 700;
            color: #0f172a;
            margin-bottom: 20px;
            display: flex;
            align-items: center;
            gap: 8px;
        }
        
        /* 타이틀 옆의 청량한 블루 인디케이터 */
        .service_title::before {
            content: '';
            display: inline-block;
            width: 8px;
            height: 8px;
            background-color: #2563eb; /* 신뢰감을 주는 선명한 블루 */
            border-radius: 50%;
        }

        /* 검색창 영역 */
        .search_box {
            position: relative;
            margin-bottom: 16px;
        }

        #keyword {
            width: 100%;
            padding: 12px 16px;
            box-sizing: border-box;
            background-color: #f1f5f9;
            border: 1px solid #e2e8f0;
            border-radius: 8px;
            color: #0f172a;
            font-size: 14px;
            transition: all 0.2s ease-in-out;
        }

        /* 포커스 시 청량한 블루 외곽선 효과 */
        #keyword:focus {
            outline: none;
            border-color: #2563eb;
            background-color: #ffffff;
            box-shadow: 0 0 0 3px rgba(37, 99, 235, 0.15);
        }

        /* 검색 내부 버튼 */
        .search_box button {
            position: absolute;
            right: 6px;
            top: 6px;
            padding: 6px 14px;
            background-color: #2563eb;
            color: #ffffff;
            border: none;
            border-radius: 6px;
            cursor: pointer;
            font-weight: 600;
            font-size: 13px;
            transition: background-color 0.2s;
        }

        .search_box button:hover {
            background-color: #1d4ed8;
        }

        /* 가로 스크롤 방식의 미니멀 탭 메뉴 */
        .tabs {
            display: flex;
            gap: 6px;
            margin-bottom: 20px;
            overflow-x: auto;
            padding-bottom: 6px;
        }

        /* 가로 스크롤바 세련되게 정돈 */
        .tabs::-webkit-scrollbar {
            height: 4px;
        }
        .tabs::-webkit-scrollbar-thumb {
            background: #cbd5e1;
            border-radius: 2px;
        }

        /* 트렌디한 칩(Chip) 스타일 버튼 */
        .tab_btn {
            padding: 8px 14px;
            background-color: #f8fafc;
            color: #64748b;
            border: 1px solid #e2e8f0;
            border-radius: 20px;
            font-size: 13px;
            cursor: pointer;
            white-space: nowrap;
            transition: all 0.2s;
        }

        .tab_btn:hover {
            color: #0f172a;
            border-color: #cbd5e1;
            background-color: #f1f5f9;
        }

        /* 선택된 탭 스타일 (청량한 블루 하이라이트) */
        .tab_btn.active {
            color: #ffffff;
            background-color: #2563eb;
            border-color: #2563eb;
            font-weight: 600;
        }

        /* 결과 데이터 리스트 영역 */
        #resultList {
            flex: 1;
            overflow-y: auto;
            background: #ffffff;
            border: 1px solid #e2e8f0;
            border-radius: 8px;
        }

        /* 리스트 스크롤바 정돈 */
        #resultList::-webkit-scrollbar {
            width: 4px;
        }
        #resultList::-webkit-scrollbar-thumb {
            background: #e2e8f0;
            border-radius: 2px;
        }

        /* 개별 장소 리스트 디자인 */
        .place_item {
            padding: 16px;
            border-bottom: 1px solid #f1f5f9;
            cursor: pointer;
            transition: background-color 0.2s;
        }

        .place_item:hover {
            background-color: #eff6ff; /* 마우스 올렸을 때 연한 블루 */
        }

        .place_title {
            color: #0f172a;
            font-size: 14px;
            font-weight: 600;
            margin-bottom: 4px;
        }

        .place_addr {
            font-size: 12px;
            color: #64748b;
            line-height: 1.4;
        }

        /* 오른쪽 지도 영역 */
        #map {
            flex: 1;
            height: 100%;
        }

        /* 화이트&블루 테마 커스텀 인포윈도우 */
        .custom_info_window {
            padding: 6px 12px;
            background-color: #ffffff;
            color: #2563eb;
            border: 1px solid #2563eb;
            border-radius: 6px;
            font-size: 12px;
            font-weight: 600;
            box-shadow: 0 4px 12px rgba(37, 99, 235, 0.15);
            white-space: nowrap;
        }
    </style>
</head>
<body>

<div id="container">
    <div id="sidebar">
        <div class="service_title">블루 익스플로러</div>

        <div class="search_box">
            <input type="text" id="keyword" placeholder="장소, 주소, 키워드 검색" onkeypress="if(event.keyCode==13) searchPlaces();">
            <button onclick="searchPlaces()">검색</button>
        </div>
        
        <div class="tabs">
            <button class="tab_btn" onclick="searchByCategory('한식')">한식</button>
            <button class="tab_btn" onclick="searchByCategory('일식')">일식</button>
            <button class="tab_btn" onclick="searchByCategory('중식')">중식</button>
            <button class="tab_btn" onclick="searchByCategory('양식')">양식</button>
            <button class="tab_btn" onclick="searchByCategory('빵집')">빵집</button>
            <button class="tab_btn" onclick="searchByCategory('카페')">카페</button>
            <button class="tab_btn" onclick="searchByCategory('음악가게')">음악가게</button>
        </div>

        <div id="resultList"></div>
    </div>
    <div id="map"></div>
</div>

<script type="text/javascript" src="//dapi.kakao.com/v2/maps/sdk.js?appkey=e78e66ec37d3a3a35bb423e78130d886&libraries=services"></script>

<script>
    let map;        // 지도 객체
    let ps;         // 장소 검색 서비스 객체
    let markers = [];   // 마커 배열
    let infowindow; // 인포윈도우 객체

    kakao.maps.load(function() {
        const container = document.getElementById('map');
        
        const options = {
            center: new kakao.maps.LatLng(37.566826, 126.9786567),
            level: 4
        };

        map = new kakao.maps.Map(container, options);
        ps = new kakao.maps.services.Places();
        infowindow = new kakao.maps.InfoWindow({ zIndex: 1 });

        // 사용자의 현재 위치 탐색 후 지도 중심 이동
        if (navigator.geolocation) {
            navigator.geolocation.getCurrentPosition(function(position) {
                const lat = position.coords.latitude;
                const lon = position.coords.longitude;
                const locPosition = new kakao.maps.LatLng(lat, lon);
                
                map.setCenter(locPosition);
                
                // 현재 위치 기준 마커 생성
                new kakao.maps.Marker({
                    map: map,
                    position: locPosition
                });
            }, function(error) {
                console.error("위치 동기화 실패", error);
            });
        }
    });

    // 카테고리 선택 검색 함수
    function searchByCategory(category) {
        const buttons = document.querySelectorAll('.tab_btn');
        buttons.forEach(btn => {
            if (btn.textContent === category) {
                btn.classList.add('active');
            } else {
                btn.classList.remove('active');
            }
        });

        document.getElementById('keyword').value = '';
        const currentCenter = map.getCenter();

        // 현재 지도 중심 기준 2km 반경 탐색
        ps.keywordSearch(category, placesSearchCB, {
            location: currentCenter,
            radius: 2000,
            sort: kakao.maps.services.SortBy.DISTANCE
        });
    }

    // 키워드 직접 입력 검색 함수
    function searchPlaces() {
        const keyword = document.getElementById('keyword').value;

        if (!keyword.replace(/^\s+|\s+$/g, '')) {
            alert('검색어를 입력해 주세요.');
            return;
        }

        const buttons = document.querySelectorAll('.tab_btn');
        buttons.forEach(btn => btn.classList.remove('active'));

        ps.keywordSearch(keyword, placesSearchCB);
    }

    // 카카오맵 API 응답 처리 콜백
    function placesSearchCB(data, status, pagination) {
        if (status === kakao.maps.services.Status.OK) {
            displayPlaces(data);
        } else if (status === kakao.maps.services.Status.ZERO_RESULT) {
            alert('주변에 해당 장소가 발견되지 않았습니다.');
        } else if (status === kakao.maps.services.Status.ERROR) {
            alert('데이터 로드 중 문제가 발생했습니다.');
        }
    }

    // 기존 마커 초기화
    function removeMarkers() {
        for (let i = 0; i < markers.length; i++) {
            markers[i].setMap(null);
        }
        markers = [];
    }

    // 지도 위에 마커와 왼쪽 리스트 렌더링
    function displayPlaces(places) {
        const listEl = document.getElementById('resultList');
        listEl.innerHTML = '';
        removeMarkers();

        const bounds = new kakao.maps.LatLngBounds();

        // 직관적인 레드 마커 핀 활용
        const imageSrc = 'https://t1.daumcdn.net/localimg/localimages/07/mapapidoc/marker_red.png';
        const imageSize = new kakao.maps.Size(31, 35); 
        const markerImage = new kakao.maps.MarkerImage(imageSrc, imageSize);

        for (let i = 0; i < places.length; i++) {
            const placePosition = new kakao.maps.LatLng(places[i].y, places[i].x);
            
            const marker = new kakao.maps.Marker({
                position: placePosition,
                image: markerImage,
                map: map
            });

            markers.push(marker);
            bounds.extend(placePosition);

            // 리스트 아이템 엘리먼트 생성
            const itemEl = document.createElement('div');
            itemEl.className = 'place_item';
            itemEl.innerHTML = '<div class="place_title">' + places[i].place_name + '</div><div class="place_addr">' + places[i].address_name + '</div>';
            
            // 이벤트 클로저 처리
            (function(m, p, pos) {
                const infoContent = '<div class="custom_info_window">' + p.place_name + '</div>';
                
                kakao.maps.event.addListener(m, 'mouseover', function() {
                    infowindow.setContent(infoContent);
                    infowindow.open(map, m);
                });

                kakao.maps.event.addListener(m, 'mouseout', function() {
                    infowindow.close();
                });

                itemEl.onclick = function() {
                    map.panTo(pos);
                    infowindow.setContent(infoContent);
                    infowindow.open(map, m);
                };
            })(marker, places[i], placePosition);

            listEl.appendChild(itemEl);
        }

        map.setBounds(bounds);
    }
</script>
</body>
</html>

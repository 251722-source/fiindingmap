<!DOCTYPE html>
<html lang="ko">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>로지스틱스 맵 관제 시스템</title>
    <style>
        body, html {
            margin: 0;
            padding: 0;
            height: 100%;
            font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, 'Helvetica Neue', Arial, sans-serif;
            background-color: #f8fafc;
            color: #334155;
            -webkit-font-smoothing: antialiased;
        }

        #container {
            display: flex;
            width: 100%;
            height: 100vh;
        }

        #sidebar {
            width: 380px;
            height: 100%;
            padding: 24px 20px;
            box-sizing: border-box;
            border-right: 1px solid #e2e8f0;
            display: flex;
            flex-direction: column;
            background-color: #ffffff;
            box-shadow: 4px 0 24px rgba(148, 163, 184, 0.08);
            z-index: 10;
        }

        .service_title {
            font-size: 16px;
            font-weight: 700;
            color: #0f172a;
            margin-bottom: 20px;
            display: flex;
            align-items: center;
            gap: 8px;
        }
        
        .service_title::before {
            content: '';
            display: inline-block;
            width: 8px;
            height: 8px;
            background-color: #2563eb;
            border-radius: 50%;
        }

        .filter_panel {
            display: flex;
            flex-direction: column;
            gap: 12px;
            margin-bottom: 16px;
        }

        .filter_group {
            display: flex;
            flex-direction: column;
            gap: 6px;
        }

        .filter_group label {
            font-size: 12px;
            font-weight: 600;
            color: #64748b;
        }

        .filter_group input, .filter_group select {
            width: 100%;
            padding: 10px 14px;
            box-sizing: border-box;
            background-color: #f1f5f9;
            border: 1px solid #e2e8f0;
            border-radius: 8px;
            color: #0f172a;
            font-size: 13px;
            transition: all 0.2s ease-in-out;
        }

        .filter_group input:focus, .filter_group select:focus {
            outline: none;
            border-color: #2563eb;
            background-color: #ffffff;
            box-shadow: 0 0 0 3px rgba(37, 99, 235, 0.1);
        }

        .search_btn {
            width: 100%;
            padding: 12px;
            background-color: #2563eb;
            color: #ffffff;
            border: none;
            border-radius: 8px;
            cursor: pointer;
            font-weight: 600;
            font-size: 14px;
            transition: background-color 0.2s;
            margin-top: 4px;
        }

        .search_btn:hover {
            background-color: #1d4ed8;
        }

        .divider {
            border: 0;
            height: 1px;
            background: #e2e8f0;
            margin: 16px 0;
        }

        .refine_group {
            background-color: #f0fdf4;
            padding: 14px;
            border-radius: 8px;
            border: 1px dashed #bbf7d0;
        }

        .refine_group label {
            color: #166534;
            display: flex;
            align-items: center;
            gap: 4px;
            font-weight: bold;
        }

        .refine_group input {
            background-color: #ffffff;
            border-color: #bbf7d0;
        }

        #resultList {
            flex: 1;
            overflow-y: auto;
            background: #ffffff;
            border: 1px solid #e2e8f0;
            border-radius: 8px;
            margin-top: 10px;
        }

        .placeholder_text {
            padding: 30px 20px;
            text-align: center;
            color: #94a3b8;
            font-size: 13px;
            line-height: 1.5;
        }

        .place_item {
            padding: 14px 16px;
            border-bottom: 1px solid #f1f5f9;
            cursor: pointer;
            transition: background-color 0.2s;
        }

        .place_item:hover {
            background-color: #eff6ff;
        }

        .place_title {
            color: #0f172a;
            font-size: 14px;
            font-weight: 600;
            margin-bottom: 4px;
        }

        .place_addr {
            font-size: 12px;
            color: #64748b;
            line-height: 1.4;
        }

        #map {
            flex: 1;
            height: 100%;
            background-color: #e5e7eb; /* 지도 로드 전 회색 배경 표시 */
        }

        .custom_info_window {
            padding: 6px 12px;
            background-color: #ffffff;
            color: #2563eb;
            border: 1px solid #2563eb;
            border-radius: 6px;
            font-size: 12px;
            font-weight: 600;
            box-shadow: 0 4px 12px rgba(37, 99, 235, 0.15);
            white-space: nowrap;
        }
    </style>
</head>
<body>

<div id="container">
    <div id="sidebar">
        <div class="service_title">로지스틱스 맵 관제 시스템</div>

        <div class="filter_panel">
            <div class="filter_group">
                <label>📍 거점 지역 설정</label>
                <input type="text" id="regionInput" placeholder="예: 고양시, 이천, 곤지암">
            </div>
            
            <div class="filter_group">
                <label>🚚 운송사/인프라 선택</label>
                <select id="categorySelect">
                    <option value="">전체운송사</option>
                    <option value="쿠팡">쿠팡 물류</option>
                    <option value="CJ대한통운">CJ대한통운</option>
                    <option value="한진택배">한진택배</option>
                    <option value="롯데택배">롯데택배</option>
                </select>
            </div>

            <div class="filter_group">
                <label>🏭 인프라 세부 검색</label>
                <input type="text" id="keywordInput" placeholder="비워두면 자동으로 '물류센터' 검색" onkeypress="if(event.keyCode==13) executeSearch();">
            </div>

            <button class="search_btn" onclick="executeSearch()">물류 거점 1차 검색</button>
        </div>

        <hr class="divider">

        <div class="filter_group refine_group">
            <label>📦 취급/보관 품목 필터 (범위 좁히기)</label>
            <input type="text" id="specialtyInput" placeholder="예: 악기, 원자재, 식자재, 가구 입력" oninput="filterBySpecialty()">
        </div>

        <div id="resultList">
            <div class="placeholder_text">상단 조건을 입력한 후<br>'물류 거점 1차 검색' 버튼을 눌러주세요.</div>
        </div>
    </div>
    <div id="map"></div>
</div>

<script type="text/javascript" src="//dapi.kakao.com/v2/maps/sdk.js?appkey=e78e66ec37d3a3a35bb423e78130d886&libraries=services"></script>

<script>
    let map;            
    let ps;             
    let markers = [];       
    let infowindow;     
    let fetchedPlaces = []; 

    // 안전한 맵 초기화 함수
    function initMap() {
        const container = document.getElementById('map');
        const defaultPos = new kakao.maps.LatLng(37.566826, 126.9786567); // 서울시청 기본값
        
        const options = {
            center: defaultPos,
            level: 7
        };

        map = new kakao.maps.Map(container, options);
        ps = new kakao.maps.services.Places();
        infowindow = new kakao.maps.InfoWindow({ zIndex: 1 });

        // 브라우저 위치 권한 체크 및 에러 핸들러 추가하여 튕김 방지
        if (navigator.geolocation) {
            navigator.geolocation.getCurrentPosition(
                function(position) {
                    const lat = position.coords.latitude;
                    const lon = position.coords.longitude;
                    const locPosition = new kakao.maps.LatLng(lat, lon);
                    map.setCenter(locPosition);
                },
                function(error) {
                    console.log("위치 권한 제한됨. 기본 위치로 지도를 구동합니다.");
                }
            );
        }
    }

    // 카카오 스크립트가 로드되었는지 확인 후 실행
    if (typeof kakao !== 'undefined' && kakao.maps) {
        kakao.maps.load(initMap);
    } else {
        alert("카카오 지도 스크립트 로드에 실패했습니다. API 키나 인터넷 연결을 확인해 주세요.");
    }

    // 1차 다중 조건 검색
    function executeSearch() {
        if (!ps) {
            alert("지도 서비스가 아직 준비되지 않았습니다.");
            return;
        }

        const region = document.getElementById('regionInput').value.trim();
        const company = document.getElementById('categorySelect').value;
        let keyword = document.getElementById('keywordInput').value.trim();

        // 사용자가 세부 검색어를 비워두면 검색 정확도를 위해 '물류센터'를 자동 지정
        if (!keyword) {
            keyword = "물류센터";
        }

        document.getElementById('specialtyInput').value = '';

        // 검색 최적화 조합 쿼리 생성
        const combinedQuery = `${region} ${company} ${keyword}`.trim().replace(/\s+/g, ' ');

        const searchOptions = {};
        // 지역을 안 적었다면 현재 보고 있는 지도 중심 반경 10km를 뒤짐
        if (!region) {
            searchOptions.location = map.getCenter();
            searchOptions.radius = 10000;
            searchOptions.sort = kakao.maps.services.SortBy.DISTANCE;
        }

        ps.keywordSearch(combinedQuery, placesSearchCB, searchOptions);
    }

    function placesSearchCB(data, status, pagination) {
        if (status === kakao.maps.services.Status.OK) {
            fetchedPlaces = data; 
            renderPlaces(fetchedPlaces); 
        } else if (status === kakao.maps.services.Status.ZERO_RESULT) {
            const listEl = document.getElementById('resultList');
            listEl.innerHTML = '<div class="placeholder_text">검색 결과가 없습니다.<br>지역명이나 운송사 조건을 다르게 해보세요.</div>';
            removeMarkers();
        } else {
            alert('지도 검색 중 오류가 발생했습니다.');
        }
    }

    // 2차 내부 품목 데이터 실시간 필터링
    function filterBySpecialty() {
        const filterValue = document.getElementById('specialtyInput').value.trim().toLowerCase();
        
        if (!filterValue) {
            renderPlaces(fetchedPlaces);
            return;
        }

        // 받아온 카카오 데이터셋 안에서 사용자가 친 키워드(가구, 식자재 등) 매칭 검사
        const filteredResult = fetchedPlaces.filter(place => {
            const matchName = place.place_name.toLowerCase().includes(filterValue);
            const matchCategory = place.category_name.toLowerCase().includes(filterValue);
            return matchName || matchCategory;
        });

        renderPlaces(filteredResult);
    }

    function removeMarkers() {
        for (let i = 0; i < markers.length; i++) {
            markers[i].setMap(null);
        }
        markers = [];
    }

    function renderPlaces(places) {
        const listEl = document.getElementById('resultList');
        listEl.innerHTML = '';
        removeMarkers();

        if (places.length === 0) {
            listEl.innerHTML = '<div class="placeholder_text">해당 품목을 취급하는 거점이 리스트에 없습니다.</div>';
            return;
        }

        const bounds = new kakao.maps.LatLngBounds();
        const imageSrc = 'https://t1.daumcdn.net/localimg/localimages/07/mapapidoc/marker_red.png';
        const imageSize = new kakao.maps.Size(31, 35); 
        const markerImage = new kakao.maps.MarkerImage(imageSrc, imageSize);

        for (let i = 0; i < places.length; i++) {
            const placePosition = new kakao.maps.LatLng(places[i].y, places[i].x);
            
            const marker = new kakao.maps.Marker({
                position: placePosition,
                image: markerImage,
                map: map
            });

            markers.push(marker);
            bounds.extend(placePosition);

            const itemEl = document.createElement('div');
            itemEl.className = 'place_item';
            itemEl.innerHTML = '<div class="place_title">' + places[i].place_name + '</div><div class="place_addr">' + places[i].address_name + '</div>';
            
            (function(m, p, pos) {
                const infoContent = '<div class="custom_info_window">' + p.place_name + '</div>';
                
                kakao.maps.event.addListener(m, 'mouseover', function() {
                    infowindow.setContent(infoContent);
                    infowindow.open(map, m);
                });

                kakao.maps.event.addListener(m, 'mouseout', function() {
                    infowindow.close();
                });

                itemEl.onclick = function() {
                    map.panTo(pos);
                    infowindow.setContent(infoContent);
                    infowindow.open(map, m);
                };
            })(marker, places[i], placePosition);

            listEl.appendChild(itemEl);
        }

        map.setBounds(bounds);
    }
</script>
</body>
</html>

<!DOCTYPE html>
<html lang="ko">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>스마트 물류 관제 디렉토리</title>
    <style>
        /* 기본 설정 및 미니멀한 서체 적용 */
        body, html {
            margin: 0;
            padding: 0;
            height: 100%;
            font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, 'Helvetica Neue', Arial, sans-serif;
            background-color: #f8fafc;
            color: #334155;
            -webkit-font-smoothing: antialiased;
        }

        /* 2분할 레이아웃 컨테이너 */
        #container {
            display: flex;
            width: 100%;
            height: 100vh;
        }

        /* 왼쪽 사이드바 (스마트 물류 관제 패널) */
        #sidebar {
            width: 380px;
            height: 100%;
            padding: 24px 20px;
            box-sizing: border-box;
            border-right: 1px solid #e2e8f0;
            display: flex;
            flex-direction: column;
            background-color: #ffffff;
            box-shadow: 4px 0 24px rgba(148, 163, 184, 0.08);
            z-index: 10;
        }

        /* 서비스 메인 타이틀 */
        .service_title {
            font-size: 16px;
            font-weight: 700;
            color: #0f172a;
            margin-bottom: 20px;
            display: flex;
            align-items: center;
            gap: 8px;
        }
        
        .service_title::before {
            content: '';
            display: inline-block;
            width: 8px;
            height: 8px;
            background-color: #2563eb; /* 청량한 관제 시스템 블루 */
            border-radius: 50%;
        }

        /* 통합 필터 패널 스타일 */
        .filter_panel {
            display: flex;
            flex-direction: column;
            gap: 12px;
            margin-bottom: 16px;
        }

        .filter_group {
            display: flex;
            flex-direction: column;
            gap: 6px;
        }

        .filter_group label {
            font-size: 12px;
            font-weight: 600;
            color: #64748b;
        }

        /* 공통 입력창 및 선택창 디자인 */
        .filter_group input, .filter_group select {
            width: 100%;
            padding: 10px 14px;
            box-sizing: border-box;
            background-color: #f1f5f9;
            border: 1px solid #e2e8f0;
            border-radius: 8px;
            color: #0f172a;
            font-size: 13px;
            transition: all 0.2s ease-in-out;
        }

        .filter_group input:focus, .filter_group select:focus {
            outline: none;
            border-color: #2563eb;
            background-color: #ffffff;
            box-shadow: 0 0 0 3px rgba(37, 99, 235, 0.1);
        }

        /* 메인 검색 실행 버튼 */
        .search_btn {
            width: 100%;
            padding: 12px;
            background-color: #2563eb;
            color: #ffffff;
            border: none;
            border-radius: 8px;
            cursor: pointer;
            font-weight: 600;
            font-size: 14px;
            transition: background-color 0.2s;
            margin-top: 4px;
        }

        .search_btn:hover {
            background-color: #1d4ed8;
        }

        /* 구분을 위한 격리선 */
        .divider {
            border: 0;
            height: 1px;
            background: #e2e8f0;
            margin: 16px 0;
        }

        /* 물류 세부 품목 2차 필터링 영역 (범위 좁히기) */
        .refine_group {
            background-color: #f0fdf4; /* 물류의 신선하고 안전한 느낌을 주는 연그린-블루 계열 */
            padding: 14px;
            border-radius: 8px;
            border: 1px dashed #bbf7d0;
        }

        .refine_group label {
            color: #166534;
            display: flex;
            align-items: center;
            gap: 4px;
            font-weight: bold;
        }

        .refine_group input {
            background-color: #ffffff;
            border-color: #bbf7d0;
        }

        /* 결과 데이터 리스트 영역 */
        #resultList {
            flex: 1;
            overflow-y: auto;
            background: #ffffff;
            border: 1px solid #e2e8f0;
            border-radius: 8px;
            margin-top: 10px;
        }

        #resultList::-webkit-scrollbar {
            width: 4px;
        }
        #resultList::-webkit-scrollbar-thumb {
            background: #e2e8f0;
            border-radius: 2px;
        }

        /* 개별 장소 아이템 디자인 */
        .place_item {
            padding: 14px 16px;
            border-bottom: 1px solid #f1f5f9;
            cursor: pointer;
            transition: background-color 0.2s;
        }

        .place_item:hover {
            background-color: #eff6ff;
        }

        .place_title {
            color: #0f172a;
            font-size: 14px;
            font-weight: 600;
            margin-bottom: 4px;
        }

        .place_addr {
            font-size: 12px;
            color: #64748b;
            line-height: 1.4;
        }

        /* 오른쪽 지도 영역 */
        #map {
            flex: 1;
            height: 100%;
        }

        /* 테마 인포윈도우 */
        .custom_info_window {
            padding: 6px 12px;
            background-color: #ffffff;
            color: #2563eb;
            border: 1px solid #2563eb;
            border-radius: 6px;
            font-size: 12px;
            font-weight: 600;
            box-shadow: 0 4px 12px rgba(37, 99, 235, 0.15);
            white-space: nowrap;
        }
    </style>
</head>
<body>

<div id="container">
    <div id="sidebar">
        <div class="service_title">로지스틱스 맵 관제 시스템</div>

        <div class="filter_panel">
            <div class="filter_group">
                <label>📍 거점 지역 설정</label>
                <input type="text" id="regionInput" placeholder="예: 고양시, 이천, 곤지암 (비우면 현재위치)">
            </div>
            
            <div class="filter_group">
                <label>🚚 운송사/인프라 선택</label>
                <select id="categorySelect">
                    <option value="">전체운송사 (전체업종)</option>
                    <option value="쿠팡">쿠팡 물류 (Coupang)</option>
                    <option value="CJ대한통운">CJ대한통운 (CJ Logistics)</option>
                    <option value="한진택배">한진택배</option>
                    <option value="롯데택배">롯데택배</option>
                    <option value="우체국물류">우체국물류</option>
                </select>
            </div>

            <div class="filter_group">
                <label>🏭 인프라 세부 검색</label>
                <input type="text" id="keywordInput" placeholder="예: 물류센터, 풀필먼트, 허브, 터미널" onkeypress="if(event.keyCode==13) executeSearch();">
            </div>

            <button class="search_btn" onclick="executeSearch()">물류 거점 1차 검색</button>
        </div>

        <hr class="divider">

        <div class="filter_group refine_group">
            <label>📦 취급/보관 품목 필터 (범위 좁히기)</label>
            <input type="text" id="specialtyInput" placeholder="예: 악기, 원자재, 식자재, 가구 등 입력" oninput="filterBySpecialty()">
        </div>

        <div id="resultList"></div>
    </div>
    <div id="map"></div>
</div>

<script type="text/javascript" src="//dapi.kakao.com/v2/maps/sdk.js?appkey=e78e66ec37d3a3a35bb423e78130d886&libraries=services"></script>

<script>
    let map;            
    let ps;             
    let markers = [];       
    let infowindow;     
    let fetchedPlaces = []; // 1차 검색으로 가져온 물류 거점 원본 데이터

    kakao.maps.load(function() {
        const container = document.getElementById('map');
        const options = {
            center: new kakao.maps.LatLng(37.566826, 126.9786567),
            level: 7 // 물류 거점 특성상 지도를 좀 더 넓게 보도록 레벨 조정
        };

        map = new kakao.maps.Map(container, options);
        ps = new kakao.maps.services.Places();
        infowindow = new kakao.maps.InfoWindow({ zIndex: 1 });

        if (navigator.geolocation) {
            navigator.geolocation.getCurrentPosition(function(position) {
                const lat = position.coords.latitude;
                const lon = position.coords.longitude;
                const locPosition = new kakao.maps.LatLng(lat, lon);
                
                map.setCenter(locPosition);
                
                new kakao.maps.Marker({
                    map: map,
                    position: locPosition
                });
            }, function(error) {
                console.error("위치 관제 시스템 로드 실패", error);
            });
        }
    });

    // 1차 다중 조건 결합 검색 엔진
    function executeSearch() {
        const region = document.getElementById('regionInput').value.trim();
        const company = document.getElementById('categorySelect').value;
        const keyword = document.getElementById('keywordInput').value.trim();

        // 범위 좁히기 창 초기화
        document.getElementById('specialtyInput').value = '';

        if (!region && !company && !keyword) {
            alert('최소 하나의 물류 검색 조건을 입력하거나 선택해 주세요.');
            return;
        }

        // 선택된 운송사와 키워드, 지역을 하나의 강력한 쿼리로 조합
        // 예: "고양시 쿠팡 물류센터"
        const combinedQuery = `${region} ${company} ${keyword}`.trim().replace(/\s+/g, ' ');

        const searchOptions = {};
        if (!region) {
            searchOptions.location = map.getCenter();
            searchOptions.radius = 5000; // 물류센터는 외곽에 많으므로 반경을 5km로 확장
            searchOptions.sort = kakao.maps.services.SortBy.DISTANCE;
        }

        ps.keywordSearch(combinedQuery, placesSearchCB, searchOptions);
    }

    function placesSearchCB(data, status, pagination) {
        if (status === kakao.maps.services.Status.OK) {
            fetchedPlaces = data; 
            renderPlaces(fetchedPlaces); 
        } else if (status === kakao.maps.services.Status.ZERO_RESULT) {
            alert('입력하신 조건과 일치하는 물류 인프라를 찾을 수 없습니다.');
        } else if (status === kakao.maps.services.Status.ERROR) {
            alert('데이터 동기화 중 오류가 발생했습니다.');
        }
    }

    // 2차 내부 품목 데이터 실시간 필터링 (범위 좁히기)
    // 카카오맵 데이터의 상호명 및 태그 정보에 '악기', '식자재', '원자재', '가구' 등이 포함되어 있는지 추적
    function filterBySpecialty() {
        const filterValue = document.getElementById('specialtyInput').value.trim().toLowerCase();
        
        if (!filterValue) {
            renderPlaces(fetchedPlaces);
            return;
        }

        const filteredResult = fetchedPlaces.filter(place => {
            const matchName = place.place_name.toLowerCase().includes(filterValue);
            const matchCategory = place.category_name.toLowerCase().includes(filterValue);
            return matchName || matchCategory;
        });

        renderPlaces(filteredResult);
    }

    function removeMarkers() {
        for (let i = 0; i < markers.length; i++) {
            markers[i].setMap(null);
        }
        markers = [];
    }

    function renderPlaces(places) {
        const listEl = document.getElementById('resultList');
        listEl.innerHTML = '';
        removeMarkers();

        if (places.length === 0) {
            listEl.innerHTML = '<div style="padding:20px; text-align:center; color:#94a3b8; font-size:13px;">해당 보관/이송 품목 조건을 만족하는 센터가 없습니다.</div>';
            return;
        }

        const bounds = new kakao.maps.LatLngBounds();
        const imageSrc = 'https://t1.daumcdn.net/localimg/localimages/07/mapapidoc/marker_red.png';
        const imageSize = new kakao.maps.Size(31, 35); 
        const markerImage = new kakao.maps.MarkerImage(imageSrc, imageSrc);

        for (let i = 0; i < places.length; i++) {
            const placePosition = new kakao.maps.LatLng(places[i].y, places[i].x);
            
            const marker = new kakao.maps.Marker({
                position: placePosition,
                image: markerImage,
                map: map
            });

            markers.push(marker);
            bounds.extend(placePosition);

            const itemEl = document.createElement('div');
            itemEl.className = 'place_item';
            itemEl.innerHTML = '<div class="place_title">' + places[i].place_name + '</div><div class="place_addr">' + places[i].address_name + '</div>';
            
            (function(m, p, pos) {
                const infoContent = '<div class="custom_info_window">' + p.place_name + '</div>';
                
                kakao.maps.event.addListener(m, 'mouseover', function() {
                    infowindow.setContent(infoContent);
                    infowindow.open(map, m);
                });

                kakao.maps.event.addListener(m, 'mouseout', function() {
                    infowindow.close();
                });

                itemEl.onclick = function() {
                    map.panTo(pos);
                    infowindow.setContent(infoContent);
                    infowindow.open(map, m);
                };
            })(marker, places[i], placePosition);

            listEl.appendChild(itemEl);
        }

        map.setBounds(bounds);
    }
</script>
</body>
</html>

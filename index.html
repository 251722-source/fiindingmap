<!DOCTYPE html>
<html lang="ko">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>스마트 물류 관제 디렉토리</title>
    <style>
        body, html {
            margin: 0;
            padding: 0;
            height: 100%;
            font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, 'Helvetica Neue', Arial, sans-serif;
            background-color: #f8fafc;
            color: #334155;
            -webkit-font-smoothing: antialiased;
        }

        #container {
            display: flex;
            width: 100%;
            height: 100vh;
        }

        /* 왼쪽 사이드바 관제 패널 */
        #sidebar {
            width: 380px;
            height: 100%;
            padding: 24px 20px;
            box-sizing: border-box;
            border-right: 1px solid #e2e8f0;
            display: flex;
            flex-direction: column;
            background-color: #ffffff;
            box-shadow: 4px 0 24px rgba(148, 163, 184, 0.08);
            z-index: 10;
        }

        .service_title {
            font-size: 16px;
            font-weight: 700;
            color: #0f172a;
            margin-bottom: 20px;
            display: flex;
            align-items: center;
            gap: 8px;
        }
        
        .service_title::before {
            content: '';
            display: inline-block;
            width: 8px;
            height: 8px;
            background-color: #2563eb;
            border-radius: 50%;
        }

        .filter_panel {
            display: flex;
            flex-direction: column;
            gap: 12px;
            margin-bottom: 16px;
        }

        .filter_group {
            display: flex;
            flex-direction: column;
            gap: 6px;
        }

        .filter_group label {
            font-size: 12px;
            font-weight: 600;
            color: #64748b;
        }

        .filter_group input, .filter_group select {
            width: 100%;
            padding: 10px 14px;
            box-sizing: border-box;
            background-color: #f1f5f9;
            border: 1px solid #e2e8f0;
            border-radius: 8px;
            color: #0f172a;
            font-size: 13px;
            transition: all 0.2s ease-in-out;
        }

        .filter_group input:focus, .filter_group select:focus {
            outline: none;
            border-color: #2563eb;
            background-color: #ffffff;
            box-shadow: 0 0 0 3px rgba(37, 99, 235, 0.1);
        }

        .search_btn {
            width: 100%;
            padding: 12px;
            background-color: #2563eb;
            color: #ffffff;
            border: none;
            border-radius: 8px;
            cursor: pointer;
            font-weight: 600;
            font-size: 14px;
            transition: background-color 0.2s;
            margin-top: 4px;
        }

        .search_btn:hover {
            background-color: #1d4ed8;
        }

        .divider {
            border: 0;
            height: 1px;
            background: #e2e8f0;
            margin: 16px 0;
        }

        /* 2차 세부 보관 품목 필터링 영역 */
        .refine_group {
            background-color: #f0fdf4;
            padding: 14px;
            border-radius: 8px;
            border: 1px dashed #bbf7d0;
        }

        .refine_group label {
            color: #166534;
            display: flex;
            align-items: center;
            gap: 4px;
            font-weight: bold;
        }

        .refine_group input {
            background-color: #ffffff;
            border-color: #bbf7d0;
        }

        #resultList {
            flex: 1;
            overflow-y: auto;
            background: #ffffff;
            border: 1px solid #e2e8f0;
            border-radius: 8px;
            margin-top: 10px;
        }

        #resultList::-webkit-scrollbar {
            width: 4px;
        }
        #resultList::-webkit-scrollbar-thumb {
            background: #e2e8f0;
            border-radius: 2px;
        }

        .place_item {
            padding: 14px 16px;
            border-bottom: 1px solid #f1f5f9;
            cursor: pointer;
            transition: background-color 0.2s;
        }

        .place_item:hover {
            background-color: #eff6ff;
        }

        .place_title {
            color: #0f172a;
            font-size: 14px;
            font-weight: 600;
            margin-bottom: 4px;
        }

        .place_addr {
            font-size: 12px;
            color: #64748b;
            line-height: 1.4;
        }

        #map {
            flex: 1;
            height: 100%;
        }

        .custom_info_window {
            padding: 6px 12px;
            background-color: #ffffff;
            color: #2563eb;
            border: 1px solid #2563eb;
            border-radius: 6px;
            font-size: 12px;
            font-weight: 600;
            box-shadow: 0 4px 12px rgba(37, 99, 235, 0.15);
            white-space: nowrap;
        }
    </style>
</head>
<body>

<div id="container">
    <div id="sidebar">
        <div class="service_title">로지스틱스 맵 관제 시스템</div>

        <div class="filter_panel">
            <div class="filter_group">
                <label>📍 거점 지역 설정</label>
                <input type="text" id="regionInput" placeholder="예: 고양시, 이천, 곤지암">
            </div>
            
            <div class="filter_group">
                <label>🚚 운송사/인프라 선택</label>
                <select id="categorySelect">
                    <option value="">전체운송사 (전체업종)</option>
                    <option value="쿠팡">쿠팡 물류 (Coupang)</option>
                    <option value="CJ대한통운">CJ대한통운 (CJ Logistics)</option>
                    <option value="한진택배">한진택배</option>
                    <option value="롯데택배">롯데택배</option>
                </select>
            </div>

            <div class="filter_group">
                <label>🏭 인프라 세부 검색</label>
                <input type="text" id="keywordInput" placeholder="예: 물류센터, 풀필먼트, 허브" onkeypress="if(event.keyCode==13) executeSearch();">
            </div>

            <button class="search_btn" onclick="executeSearch()">물류 거점 1차 검색</button>
        </div>

        <hr class="divider">

        <div class="filter_group refine_group">
            <label>📦 취급/보관 품목 필터 (범위 좁히기)</label>
            <input type="text" id="specialtyInput" placeholder="예: 악기, 원자재, 식자재, 가구" oninput="filterBySpecialty()">
        </div>

        <div id="resultList"></div>
    </div>
    <div id="map"></div>
</div>

<script type="text/javascript" src="https://dapi.kakao.com/v2/maps/sdk.js?appkey=여기_본인의_자바스크립트_키_입력&libraries=services"></script>

<script>
    let map;            
    let ps;             
    let markers = [];       
    let infowindow;     
    let fetchedPlaces = []; 

    // 카카오맵 SDK 로드 후 실행
    kakao.maps.load(function() {
        const container = document.getElementById('map');
        const options = {
            center: new kakao.maps.LatLng(37.402707, 127.105199), // 초기 중심점 (판교 부근)
            level: 9 
        };

        map = new kakao.maps.Map(container, options);
        ps = new kakao.maps.services.Places();
        infowindow = new kakao.maps.InfoWindow({ zIndex: 1 });

        // 테스트용 초기 가상 물류 데이터 세팅 (첫 화면에 바로 뜨는 샘플 데이터)
        fetchedPlaces = [
            { place_name: "쿠팡 고양 메가 풀필먼트 (식자재 및 생활용품 보관)", address_name: "경기도 고양시 덕양구 권율대로 570", y: 37.6444, x: 126.8865, category_name: "물류센터" },
            { place_name: "CJ대한통운 곤지암 메가허브 (가구 및 대형화물 이송)", address_name: "경기도 광주시 곤지암읍 건업길 14", y: 37.3412, x: 127.3234, category_name: "물류센터" },
            { place_name: "한진 인천공항 GDC (수입 악기 및 고가품 보관소)", address_name: "인천광역시 중구 공항동로 296", y: 37.4525, x: 126.4712, category_name: "물류센터" },
            { place_name: "롯데물류 오산센터 (전자제품 및 산업 원자재 창고)", address_name: "경기도 오산시 가장산업서로 100", y: 37.1612, x: 127.0345, category_name: "물류센터" }
        ];

        // 초기 샘플 데이터 뿌리기
        renderPlaces(fetchedPlaces);
    });

    // 1차 API 결합 키워드 검색
    function executeSearch() {
        const region = document.getElementById('regionInput').value.trim();
        const company = document.getElementById('categorySelect').value;
        const keyword = document.getElementById('keywordInput').value.trim();

        document.getElementById('specialtyInput').value = '';

        if (!region && !company && !keyword) {
            alert('검색 조건을 최소 하나 이상 입력해 주세요.');
            return;
        }

        const combinedQuery = `${region} ${company} ${keyword}`.trim().replace(/\s+/g, ' ');
        
        // 카카오 API 검색 호출
        ps.keywordSearch(combinedQuery, placesSearchCB);
    }

    function placesSearchCB(data, status, pagination) {
        if (status === kakao.maps.services.Status.OK) {
            fetchedPlaces = data; 
            renderPlaces(fetchedPlaces); 
        } else if (status === kakao.maps.services.Status.ZERO_RESULT) {
            alert('해당 조건의 물류 거점을 찾을 수 없습니다. (샘플 데이터 유지)');
        } else if (status === kakao.maps.services.Status.ERROR) {
            alert('데이터 로
